const EV=[
["中国","妨害","小さな都市が2個降ってきた",()=>{for(let i=0;i<2;i++)balls.push({x:40+Math.random()*(W-80),y:30,vx:0,vy:0,l:0,age:0,t:0})}],

["台湾","支援","次に大きな都市が来る",()=>{nxt=Math.max(nxt,4);ui()}],
["インド","支援","一番上の都市を1つ撤去",()=>{rmTop()}],
["トルコ","支援","友好の贈り物で国力+30",()=>{power+=30;ui()}],
["フィリピン","支援","次に同じ都市がもう1つ続く",()=>{nxt=cur;ui()}],
["アメリカ","支援","次の妨害を1回防ぐ",()=>{shield++}]
];
let bmx=null;
function beam(){const m=26,a=Math.random(),sd=Math.floor(Math.random()*4);let ox,oy;if(sd===0){ox=a*W;oy=-m}else if(sd===1){ox=a*W;oy=H+m}else if(sd===2){ox=-m;oy=a*H}else{ox=W+m;oy=a*H}const px=Math.random()*W,py=Math.random()*H,d=Math.hypot(px-ox,py-oy),ux=(px-ox)/d,uy=(py-oy)/d,hw=T[2].r;balls=balls.filter(b=>{const rx=b.x-ox,ry=b.y-oy,t=rx*ux+ry*uy,ds=Math.abs(rx*uy-ry*ux),rr=T[b.l].r;return !(t>-rr&&ds<=hw+rr)});bmx={ox,oy,ux,uy,hw,t:.9};const c=$("bm");c.width=innerWidth;c.height=innerHeight;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px"}

function hit(l){sfx("hit",l);

 else if(l===8){for(let i=0;i<4;i++)balls.push({x:50+Math.random()*(W-100),y:30-i*45,vx:0,vy:0,l:4,age:0,t:0,s:true});note("開港! しゅうまいが4つ降ってきた")}

}

const TS=[["落として合体","画面をスライドして位置を決め、指を離すと落ちます。\n同じ都市がぶつかると、次の都市に合体します。"],["吸収で国力アップ","合体してできた都市には、金色の輪がつきます。\nダブルタップすると日本に吸収されて、国力が増えます。\n増える量は都市のレベルの2乗です(夕張は1、東京は100)。\n吸収した都市は、盤面から消えます。"],["ひとりで遊ぶ","制限時間は1分。時間内にどれだけ国力を伸ばせるかを競います。\n名古屋・大阪・横浜・東京(福岡より上)を吸収すると、残り時間が+2〜+5秒増えます。\n赤い点線より上に2秒以上はみ出すと、終わりです。"],["2人で対戦","先に国力800に届くか、相手がゲームオーバーになると勝ちです。\n吸収すると、相手に妨害が飛びます。\n夕張〜福岡: パンチ(相手の国力-2)\n名古屋: 10秒間、相手は吸収できない\n大阪: 相手の都市が2つ、たこ焼きに変わる\n横浜: 相手にしゅうまいが4つ降る\n東京: 東京タワーのビームで、当たった都市が消える"],["フィーバー","東京を2つ合体させると、2つとも消えて10秒間のフィーバーになります。\nひとりでは残り時間が止まり、2人対戦では吸収の国力が2倍になります。\nBGMもにぎやかな曲に変わります。"]];
let ti=0;
function tshow(){const s=TS[ti];$("th").textContent=s[0];$("tb").textContent=s[1];$("ti").src=IMG[ti];$("tc").hidden=ti!==0;$("td").textContent=TS.map((_,i)=>i===ti?"●":"○").join(" ");$("tp").style.visibility=ti?"visible":"hidden";$("tn").textContent=ti<TS.length-1?"次へ":"はじめる"}
function topen(){ti=0;tshow();$("tut").hidden=false}
function tclose(){$("tut").hidden=true;try{localStorage.setItem("sg_tut","1")}catch(e){}}
$("b4").onclick=topen;$("tp").onclick=()=>{ti=Math.max(0,ti-1);tshow()};$("tn").onclick=()=>{if(ti<TS.length-1){ti++;tshow()}else tclose()};$("tx").onclick=tclose;
$("tc").innerHTML=T.map(t=>'<span style="background:'+t.c+';color:'+t.tc+'">'+t.n+'</span>').join("→");
$("title").onclick=()=>{au();$("title").hidden=true;topen()};
$("lv").onclick=()=>{if(over||confirm("退出すると負けになります。退出しますか?")){if(conn&&conn.open)conn.send({t:"leave"});location.reload()}};
addEventListener("pagehide",()=>{if(conn&&conn.open&&!over)conn.send({t:"leave"})});
function host(c,re){peer=new Peer("jpcg-"+c);peer.on("open",()=>{try{localStorage.setItem("sg_room",JSON.stringify({c:c,t:Date.now()}))}catch(e){}$("st").textContent="部屋コード: "+c+"\n相手の参加を待っています\n(コードを送ったあとも、このページは閉じないで)";$("sh").hidden=false;wl()});peer.on("connection",k=>{k.on("open",()=>{setup(k);$("lobby").hidden=true;startVs()})});peer.on("disconnected",()=>{if(!conn&&peer&&!peer.destroyed)setTimeout(()=>{try{peer.reconnect()}catch(e){}},500)});peer.on("error",e=>{if(e.type==="unavailable-id"&&re){peer.destroy();host(Math.random().toString(36).slice(2,6),0)}else $("st").textContent="エラー: "+e.type})}
let wlk=null;function wl(){try{if(navigator.wakeLock&&!wlk)navigator.wakeLock.request("screen").then(l=>{wlk=l;l.addEventListener("release",()=>{wlk=null})}).catch(()=>{})}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(peer&&peer.disconnected&&!peer.destroyed){try{peer.reconnect()}catch(e){}}if(peer&&!conn&&!$("lobby").hidden)wl()}});
$("sh").onclick=()=>{const m=$("st").textContent.match(/部屋コード: (\w+)/);if(!m)return;const t="日本の都市合体ゲームで対戦しよう! 部屋コード: "+m[1]+"\n"+location.origin+location.pathname;if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{$("st").textContent+="\n(コピーしました)"}).catch(()=>{})};
