function nz(d,v,fc){const a=au();if(!a)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=fc;s.buffer=b;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);s.connect(f);f.connect(g);g.connect(MG);s.start()}
function sfx(n,l){const a=au();if(!a)return;const t=a.currentTime;

 else if(n==="merge"){const f=330*Math.pow(1.09,l);tone(f,.16,"triangle",.3,t);tone(f*1.5,.2,"sine",.2,t+.06)}

 else if(n==="hit"){if(l<6){nz(.25,.5,600);tone(140,.25,"sawtooth",.25,t,45)}else if(l===6)tone(500,.5,"square",.12,t,90);else if(l===7){tone(700,.12,"square",.12,t);tone(500,.12,"square",.12,t+.12);tone(300,.2,"square",.12,t+.24)}else if(l===8){tone(196,.8,"sawtooth",.15,t);tone(147,.8,"sawtooth",.15,t)}else{nz(.8,.7,200);tone(60,.8,"sine",.5,t,30)}}

const SA=[67,1,67,.75,65,.25,63,.5,65,.5,67,.5,68,.5,70,.75,70,.25,70,.5,70,.5,70,1.5,0,.5,67,1,67,.75,67,.25,67,.5,68,.5,67,.5,65,.5,63,1,65,1,67,1.5,0,.5,65,.75,67,.25,65,.5,63,.5,62,.5,60,.5,58,.5,60,.5,58,.5,63,.5,65,.5,67,.5,67,.75,65,.25,65,1,67,.75,67,.25,70,.5,70,.5,67,.5,70,.5,67,.5,63,.5,65,.5,70,.5,68,.5,65,.5,67,.75,65,.25,63,1];

function mk(arr,bl,bpm){const mel=[];let t=0;for(let i=0;i<arr.length;i+=2){if(arr[i])mel.push([t,arr[i],arr[i+1]]);t+=arr[i+1]}const tot=t,s=60/bpm,ev=[];
