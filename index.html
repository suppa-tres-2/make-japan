<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本の都市合体ゲーム</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#fff8ec;--fg:#3b2a1a;--box:#fffdf7;--line:#e0405a;--btn:#ff9f1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--fg:#f3e8d6;--box:#2a2318;--line:#ff6b81;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1812;--fg:#f3e8d6;--box:#2a2318;--line:#ff6b81;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
#hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-weight:700}
#hd small{display:block;font-weight:400;opacity:.7;font-size:11px}
#nx{font-size:15px;line-height:1.2}
#ch{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;max-width:94vw;font-size:11px;font-weight:700}
#ch[hidden]{display:none}
#goal{font-weight:700;font-size:14px;text-align:center;white-space:pre-line}
#ch span{padding:2px 6px;border-radius:10px}
#lobby{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#lobby[hidden]{display:none}
#cd{font-size:18px;padding:6px;border-radius:8px;border:2px solid var(--fg);background:var(--box);color:var(--fg)}
#st{white-space:pre-line;font-weight:700}
#opp{font-weight:700;font-size:13px}
button{background:var(--btn);border:0;border-radius:8px;padding:6px 10px;font-weight:700;color:#3b2a1a}
canvas{aspect-ratio:360/520;border-radius:12px;border:3px solid var(--fg);touch-action:none;display:block}
#c{width:min(94vw,calc((100dvh - 160px)*0.6923))}
body.vs #c{width:min(66vw,calc((100dvh - 190px)*0.6923))}
#mc{width:24vw;max-width:130px;border-width:2px;border-radius:8px}
#mc[hidden]{display:none}
#wrap{display:flex;gap:6px;align-items:flex-start;justify-content:center}
#pwr{text-align:center;font-weight:800}
#pn{font-size:30px;color:var(--btn)}
.bar{height:10px;border-radius:6px;background:rgba(128,128,128,.3);overflow:hidden;width:min(94vw,300px);margin:2px auto}
.bar i{display:block;height:100%;width:0;background:var(--btn);transition:width .3s}
#obar i{background:#6fb7e8}
#opp{text-align:center}
</style></head><body>
<div id="lobby"><b style="font-size:20px">日本の都市合体ゲーム</b>
<button id="b1">ひとりで遊ぶ</button>
<button id="b2">部屋をつくる(2人対戦)</button>
<div><input id="cd" maxlength="4" placeholder="部屋コード" size="7"> <button id="b3">入る</button></div>
<div id="st"></div></div>
<div id="hd">
<div><small>スコア</small><span id="sc">0</span></div>
<div><small>ベスト</small><span id="bs">0</span></div>
<div><small>次</small><span id="nx"></span></div>
<button id="rs">リスタート</button>
<button id="tg">順番</button>
</div>
<div id="pwr"><span id="pn">国力 0</span><div class="bar" id="bar"><i id="pf"></i></div></div>
<div id="goal"></div>
<div id="opp"><span id="on"></span><div class="bar" id="obar"><i id="of"></i></div></div>
<div id="wrap"><canvas id="c"></canvas><canvas id="mc" hidden></canvas></div>
<div id="ch"></div>
<script>
const W=360,H=520,LINE=90;
const T=[{r:14,n:"夕張",c:"#d9f2d0",tc:"#2b1d12"},{r:20,n:"熱海",c:"#a8e6cf",tc:"#2b1d12"},{r:26,n:"鎌倉",c:"#7fd1c7",tc:"#2b1d12"},{r:32,n:"金沢",c:"#6fb7e8",tc:"#2b1d12"},{r:39,n:"仙台",c:"#7a8cf0",tc:"#fff"},{r:47,n:"福岡",c:"#a47be8",tc:"#fff"},{r:55,n:"名古屋",c:"#e47bc4",tc:"#2b1d12"},{r:64,n:"大阪",c:"#f08a5d",tc:"#2b1d12"},{r:73,n:"横浜",c:"#e8b92f",tc:"#2b1d12"},{r:84,n:"東京",c:"#d62839",tc:"#fff"}];
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
let balls,score,cur,nxt,x,cool,over,best=0,power,goalL,evt,msg,msgT,jam,shield=0,fx=[],lastTap={b:null,t:0},skipDrop=false,conn=null,peer=null,lock=0,pun=null,res="",opp=0,sentP=-1,rdy=false,opRdy=false,ob=[],bt=0;const GOAL=300;
try{best=+localStorage.getItem("sg_best")||0}catch(e){}
const rnd=()=>Math.floor(Math.random()*4);
const $=id=>document.getElementById(id);
function ui(){if(conn&&conn.open&&sentP!==power){sentP=power;conn.send({t:"pw",p:power})}if(conn&&power>=GOAL&&!over){conn.send({t:"fin"});res="勝ち";over=true}$("on").textContent=conn?"相手 国力 "+opp+"(先に "+GOAL+" で勝ち)":"";$("sc").textContent=score;$("pn").textContent="国力 "+power+(conn?" / "+GOAL:"");$("bar").hidden=!conn;$("pf").style.width=Math.min(100,power/GOAL*100)+"%";$("obar").hidden=!conn;$("of").style.width=Math.min(100,opp/GOAL*100)+"%";$("bs").textContent=best;$("nx").textContent=T[nxt].n;$("goal").textContent="目標: "+T[goalL].n+"を吸収で国力×2\n光る都市をダブルタップで日本に吸収"}
const pick=()=>3+Math.floor(Math.random()*6);
function reset(){balls=[];fx=[];lastTap={b:null,t:0};skipDrop=false;shield=0;lock=0;pun=null;res="";opp=0;sentP=-1;rdy=false;opRdy=false;ob=[];bt=0;score=0;power=0;goalL=pick();evt=35;msg="";msgT=0;jam=0;cur=rnd();nxt=rnd();x=W/2;cool=0.3;over=false;ui()}
function drop(){let dx=x;if(jam>0){jam--;const r=T[cur].r;dx=Math.max(r,Math.min(W-r,x+(Math.random()-.5)*120))}balls.push({x:dx,y:40,vx:0,vy:0,l:cur,age:0,t:0});cur=nxt;nxt=rnd();cool=0.6;ui()}
function note(s){msg=s;msgT=3.5}
function absorb(b){if(lock>0){note("工場停止中で吸収できない");return}const g=(b.l+1)*(b.l+1);let p=g;if(b.l===goalL){p=g*2;note("目標達成! "+T[goalL].n+"を吸収。国力×2");goalL=pick()}else note(T[b.l].n+"を日本に吸収");if(conn){if(b.l===7)p+=20;if(b.l===9)p+=30;if(conn.open)conn.send({t:"atk",l:b.l})}power+=p;fx.push({x:b.x,y:b.y,s:"+"+p,t:1.2});balls.splice(balls.indexOf(b),1);ui()}
function hitM(e){const r=cv.getBoundingClientRect(),cx=(e.clientX-r.left)/r.width*W,cy=(e.clientY-r.top)/r.height*H;let hb=null,bd=9;for(const b of balls){if(!b.m)continue;const d=Math.hypot(b.x-cx,b.y-cy)/T[b.l].r;if(d<1&&d<bd){bd=d;hb=b}}return hb}
const EV=[
["中国","妨害","小さな都市が2個降ってきた",()=>{for(let i=0;i<2;i++)balls.push({x:40+Math.random()*(W-80),y:30,vx:0,vy:0,l:0,age:0,t:0})}],
["ロシア","妨害","次の2回は狙いがずれる",()=>{jam=2}],
["台湾","支援","次に大きな都市が来る",()=>{nxt=Math.max(nxt,4);ui()}],
["インド","支援","一番上の都市を1つ撤去",()=>{rmTop()}],
["トルコ","支援","友好の贈り物で国力+30",()=>{power+=30;ui()}],
["フィリピン","支援","次に同じ都市がもう1つ続く",()=>{nxt=cur;ui()}],
["アメリカ","支援","次の妨害を1回防ぐ",()=>{shield++}]
];
function shake(){for(const b of balls){b.vx+=(Math.random()-.5)*600;b.vy-=200}}
function hit(l){
 if(l<6){pun={t:1.6,x:70+Math.random()*(W-140),y:130+Math.random()*(H-300)};power=Math.max(0,power-2);note("パンチを食らった! 国力-2");ui()}
 else if(l===6){lock=10;note("工場停止! 10秒間 吸収できない")}
 else if(l===7){power=Math.max(0,power-20);note("商都に国力を奪われた! -20");ui()}
 else if(l===8){cur=4;nxt=4;note("開港! 大きな都市が続く");ui()}
 else{shake();power=Math.max(0,power-30);note("一極集中! 揺れと強奪 -30");ui()}
}
const mc=$("mc"),mx=mc.getContext("2d");mc.width=W;mc.height=H;
function mini(){const cs=getComputedStyle(document.documentElement);mx.clearRect(0,0,W,H);mx.fillStyle=cs.getPropertyValue("--box");mx.fillRect(0,0,W,H);mx.setLineDash([12,12]);mx.strokeStyle=cs.getPropertyValue("--line");mx.lineWidth=4;mx.beginPath();mx.moveTo(0,LINE);mx.lineTo(W,LINE);mx.stroke();mx.setLineDash([]);for(const q of ob){const t=T[q[2]];mx.fillStyle=t.c;mx.beginPath();mx.arc(q[0],q[1],t.r,0,7);mx.fill();mx.lineWidth=3;mx.strokeStyle="rgba(0,0,0,.35)";mx.stroke()}mx.fillStyle=cs.getPropertyValue("--fg");mx.globalAlpha=.25;mx.font="bold 90px sans-serif";mx.textAlign="center";mx.fillText("相手",W/2,H-30);mx.globalAlpha=1}
function go(){if(rdy&&opRdy)reset()}
function recv(m){if(m.t==="rdy"){opRdy=true;go();return}if(over)return;if(m.t==="atk")hit(m.l);else if(m.t==="pw"){opp=m.p;ui()}else if(m.t==="bd"){ob=m.b}else if(m.t==="fin"){res="負け";over=true}else if(m.t==="over"){res="勝ち";over=true}}
function setup(k){conn=k;document.body.classList.add("vs");$("mc").hidden=false;$("rs").hidden=true;k.on("data",recv);k.on("close",()=>{if(!over){res="勝ち(相手が退出)";over=true}})}
function rmTop(){if(!balls.length)return;let m=balls[0];for(const b of balls)if(b.y<m.y)m=b;balls.splice(balls.indexOf(m),1)}
function fireEvent(){const h=!conn&&Math.random()<.55;const pool=EV.filter(e=>(e[1]==="妨害")===h);const e=pool[Math.floor(Math.random()*pool.length)];if(e[1]==="妨害"&&shield>0){shield--;note("アメリカの支援で"+e[0]+"の妨害を防いだ");return}e[3]();note(e[0]+"の"+e[1]+": "+e[2])}
function step(dt){
 for(const b of balls){
  b.vy+=1800*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.age+=dt;const r=T[b.l].r;
  if(b.x<r){b.x=r;b.vx*=-.2}
  if(b.x>W-r){b.x=W-r;b.vx*=-.2}
  if(b.y>H-r){b.y=H-r;b.vy*=-.1;b.vx*=.98}
 }
 const mg=[];
 for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
  const a=balls[i],b=balls[j],ra=T[a.l].r,rb=T[b.l].r;
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),s=ra+rb;
  if(d>=s||d===0)continue;
  if(a.l===b.l&&!a.dead&&!b.dead){a.dead=b.dead=true;mg.push([a,b]);continue}
  const nx=dx/d,ny=dy/d,ma=ra*ra,mb=rb*rb,ov=s-d;
  a.x-=nx*ov*mb/(ma+mb);a.y-=ny*ov*mb/(ma+mb);
  b.x+=nx*ov*ma/(ma+mb);b.y+=ny*ov*ma/(ma+mb);
  const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(vn<0){const k=-1.1*vn/(1/ma+1/mb);a.vx-=k*nx/ma;a.vy-=k*ny/ma;b.vx+=k*nx/mb;b.vy+=k*ny/mb}
 }
 if(mg.length){
  for(const [a,b] of mg){
   if(a.l<9){balls.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:(a.vx+b.vx)/2,vy:(a.vy+b.vy)/2,l:a.l+1,age:2,t:0,m:true});score+=(a.l+2)*(a.l+1)/2}
   else score+=100;
  }
  balls=balls.filter(b=>!b.dead);
  if(score>best){best=score;try{localStorage.setItem("sg_best",best)}catch(e){}}
  ui();
 }
}
function ball(px,py,l){
 const t=T[l];ctx.fillStyle=t.c;ctx.beginPath();ctx.arc(px,py,t.r,0,7);ctx.fill();
 ctx.lineWidth=2;ctx.strokeStyle="rgba(0,0,0,.25)";ctx.stroke();
 const fs=Math.round(Math.min(t.r*.9,t.r*1.7/t.n.length));
 ctx.font="bold "+fs+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillStyle=t.tc;ctx.fillText(t.n,px,py);
}
function draw(){
 const cs=getComputedStyle(document.documentElement);
 const fg=cs.getPropertyValue("--fg"),box=cs.getPropertyValue("--box"),ln=cs.getPropertyValue("--line");
 ctx.clearRect(0,0,W,H);ctx.fillStyle=box;ctx.fillRect(0,0,W,H);
 ctx.setLineDash([6,6]);ctx.strokeStyle=ln;ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();ctx.setLineDash([]);
 if(!over&&cool<=0){
  ctx.globalAlpha=.3;ctx.strokeStyle=fg;ctx.beginPath();ctx.moveTo(x,40+T[cur].r);ctx.lineTo(x,H);ctx.stroke();ctx.globalAlpha=1;
  ball(x,40,cur);
 }
 for(const b of balls){ball(b.x,b.y,b.l);if(b.m){ctx.strokeStyle="#ffd24a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,T[b.l].r-3,0,7);ctx.stroke()}}
 for(const f of fx){ctx.globalAlpha=Math.min(1,f.t);ctx.font="bold 20px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="#000";ctx.strokeText(f.s,f.x,f.y);ctx.fillStyle="#ffd24a";ctx.fillText(f.s,f.x,f.y);ctx.globalAlpha=1}
 if(pun){const p=1-pun.t/1.6,a=Math.min(1,pun.t*2),fp=pun.x+90*(1-Math.min(1,p*5));ctx.globalAlpha=a;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="110px serif";ctx.fillText("😵",pun.x,pun.y);ctx.font="90px serif";ctx.fillText("👊",fp+40,pun.y);if(p>.2)ctx.fillText("💥",pun.x+10,pun.y-60);ctx.globalAlpha=1}
 if(msgT>0){ctx.globalAlpha=Math.min(1,msgT);ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(10,104,W-20,36);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold 14px sans-serif";ctx.fillText(msg,W/2,122);ctx.globalAlpha=1}
 if(over){
  ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="bold 34px sans-serif";ctx.fillText(res||"ゲームオーバー",W/2,H/2-16);
  ctx.font="18px sans-serif";ctx.fillText("国力 "+power+"  スコア "+score,W/2,H/2+20);ctx.fillText(conn?(rdy?"相手の準備を待っています":"タップで準備OK(2人そろうと再開)"):"タップでもう一度",W/2,H/2+48);
 }
}
function px(e){const r=cv.getBoundingClientRect(),rr=T[cur].r;x=Math.max(rr,Math.min(W-rr,(e.clientX-r.left)/r.width*W))}
cv.addEventListener("pointerdown",e=>{if(over){if(conn&&conn.open){if(!rdy){rdy=true;conn.send({t:"rdy"});go()}}else if(conn)location.reload();else reset();return}px(e);const h=hitM(e),n=performance.now();skipDrop=!!h;if(h){if(lastTap.b===h&&n-lastTap.t<350){absorb(h);lastTap.b=null}else lastTap={b:h,t:n}}});
cv.addEventListener("pointermove",px);
cv.addEventListener("pointerup",e=>{if(over||cool>0||skipDrop)return;px(e);drop()});
$("rs").addEventListener("click",()=>{if(!conn)reset()});
$("ch").innerHTML=T.map(t=>'<span style="background:'+t.c+';color:'+t.tc+'">'+t.n+'</span>').join("→");
$("tg").addEventListener("click",()=>{$("ch").hidden=!$("ch").hidden});
let last=performance.now();
function loop(n){
 const dt=Math.min((n-last)/1000,1/30);last=n;
 if(!over){
  cool-=dt;evt-=dt;msgT-=dt;lock-=dt;bt-=dt;if(conn&&conn.open&&bt<=0){bt=.2;conn.send({t:"bd",b:balls.map(b=>[Math.round(b.x),Math.round(b.y),b.l])})}if(evt<=0){evt=35+Math.random()*20;if(!conn)fireEvent()}for(const f of fx){f.t-=dt;f.y-=30*dt}fx=fx.filter(f=>f.t>0);if(pun){pun.t-=dt;if(pun.t<=0)pun=null}
  for(let i=0;i<6;i++)step(dt/6);
  for(const b of balls){
   if(b.age>1&&b.y-T[b.l].r<LINE)b.t+=dt;else b.t=0;
   if(b.t>2&&!over){over=true;if(conn){res="負け";conn.send({t:"over"})}}
  }
 }
 draw();if(conn)mini();requestAnimationFrame(loop);
}
$("b1").onclick=()=>{$("lobby").hidden=true;reset()};
$("b2").onclick=()=>{if(!window.Peer){$("st").textContent="通信ライブラリを読み込めません\nGitHub上のページで使えます";return}const c=Math.random().toString(36).slice(2,6);peer=new Peer("jpcg-"+c);$("st").textContent="部屋コード: "+c+"\n相手の参加を待っています";peer.on("connection",k=>{k.on("open",()=>{setup(k);$("lobby").hidden=true;reset()})});peer.on("error",e=>{$("st").textContent="エラー: "+e.type})};
$("b3").onclick=()=>{if(!window.Peer){$("st").textContent="通信ライブラリを読み込めません\nGitHub上のページで使えます";return}const c=$("cd").value.trim().toLowerCase();if(!c)return;peer=new Peer();$("st").textContent="接続中...";peer.on("open",()=>{const k=peer.connect("jpcg-"+c);k.on("open",()=>{setup(k);$("lobby").hidden=true;reset()});setTimeout(()=>{if(!conn)$("st").textContent="つながりません。コードを確認してください"},8000)});peer.on("error",e=>{$("st").textContent="エラー: "+e.type})};
reset();requestAnimationFrame(loop);
</script></body></html>
